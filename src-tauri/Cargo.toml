[package]
name = "harbor-file"
version = "0.1.0"
description = "A calm, native file transfer client for macOS"
authors = ["Harbor File"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
tauri = { version = "2", features = [] }
